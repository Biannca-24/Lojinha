<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Lojinha</title>

  <link rel="stylesheet" href="css/bootstrap.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="css/style.css">

  <script src="js/funcoes.js"></script>

 </head>
 <body>
   <div class="container">

    <h1> <i style="color: darkred;" class="bi bi-cart-check"></i> Lojinha da Unidade</h1>

    <table class="table table-hover">
       <thead>
           <tr>
              <th>imagem</th>
              <th>Produto</th>
              <th>Preço unitario</th>
              <th>Quantidade</th>
              <th>Total</th>
           </tr>
       </thead>
       <tbody>
           <tr>
              <td>
                <img src="img/produto_1.avif" alt="Produto 1" width="150">
              </td>
              <td>
                 <div>Moto g 42</div>
                 <div>Codigo: 65552</div>
                 <div><span>Cor: Rosa </span></div>
              </td>
              <td id="valor_1">R$ 1.000</td>
              <td>
                  <span class="badge bg-danger" onclick="alterarQtd(1, '-')"><i class="bi bi-dash"></i></span>
                  <span id="qtd_1">0</span>
                  <span class="badge bg-success" onclick="alterarQtd(1, '+')"><i class="bi bi-plus"></i> </span>
              </td>
              <td id="total_1">0</td>
           </tr>
           <tr>
            <td>
              <img src="img/produto_2.jpg" alt="Produto 2" width="200">
            </td>
            <td>
               <div>Notebook</div>
               <div>Codigo: 00526</div>
               <div>Cor: Preto e vermelho</div>
            </td>
            <td id="valor_2">R$ 4.000</td>
            <td>
               <span class="badge bg-danger" onclick="alterarQtd(2, '-')"><i class="bi bi-dash"></i></span>
               <span id="qtd_2">0</span>
               <span class="badge text-bg-success"onclick="alterarQtd(2, '+')"><i class="bi bi-plus"></i></span>
            </td>
            <td id="total_2">0</td>
         </tr>
         <tr>
          <td>
            <img src="img/produto_3.png" alt="Produto 3" width="200">
          </td>
          <td>
             <div>Televisão</div>
             <div>Codigo: 90024</div>
             <div>Cor: Preto</div>
          </td>
          <td id="valor_3">R$ 3.500</td>
          <td>
            <span class="badge bg-danger" onclick="alterarQtd(3, '-')"><i class="bi bi-dash"></i></span>
            <span id="qtd_3">0</span>
            <span class="badge text-bg-success"onclick="alterarQtd(3, '+')"><i class="bi bi-plus"></i></span>
          </td>
          <td id="total_3">0</td>
       </tr>
       </tbody>

    </table>
      <footer class="text-center">
        <span><i class="bi bi-bag-check"> Subtotal: </i><span id="subtotal"> R$ 0</span></span>
      </footer>
   </div>   
</body>
</html>
